name: Node 24 validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node dist/index.js doctor --home ./test-results/doctor
      - run: node dist/index.js init --home ./test-results/init
      - run: pnpm test:smoke
      - name: Search equivalence and 50k/100k latency benchmark
        run: node benchmarks/search.mjs test-results/search-benchmark.json
      - name: Keep raw benchmark distributions and query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-benchmark-${{ matrix.os }}
          path: test-results/search-benchmark.json
          if-no-files-found: warn
  release-gate:
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux and Windows success
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = "success"
